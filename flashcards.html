<style>
/* Layout: a revision desk — subject strip, chapter list, one ruled index card in the middle, controls beneath. */
:root{
  --desk:#eef1f5; --card:#ffffff; --ink:#1d2a3a; --muted:#5a6878;
  --rule:#cfdcea; --margin:#e2777a; --accent:#2b5d9b; --ok:#2f7d4f; --again:#b5542b; --chip:#dfe7f1;
  --display:"Literata",Georgia,"Times New Roman",serif; --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#141a22; --card:#1e2631; --ink:#e7edf5; --muted:#9aa8b8; --rule:#2c3a4b; --margin:#b4575a; --accent:#7fb0ec; --ok:#6cc58f; --again:#e38a62; --chip:#263243; color-scheme:dark}}
:root[data-theme="dark"]{--desk:#141a22; --card:#1e2631; --ink:#e7edf5; --muted:#9aa8b8; --rule:#2c3a4b; --margin:#b4575a; --accent:#7fb0ec; --ok:#6cc58f; --again:#e38a62; --chip:#263243; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3vw,2rem);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.subjects{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.subj{border:1px solid var(--rule);background:var(--card);padding:8px 14px;border-radius:999px}
.subj[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.chapters{display:flex;flex-direction:column;gap:6px;min-width:0}
.chap{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:8px}
.chap:hover{background:var(--chip)}
.chap[aria-current="true"]{background:var(--card);border-color:var(--rule);font-weight:700}
.chap small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){.chapters{flex-direction:row;overflow-x:auto;padding-bottom:4px}.chap{white-space:nowrap;flex:0 0 auto}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.card{position:relative;background:var(--card);border-radius:6px;box-shadow:0 1px 0 var(--rule),0 10px 30px rgba(20,40,70,.12);min-height:300px;padding:44px 28px 28px 64px;cursor:pointer;
  background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-size:100% 40px,100% 100%;background-repeat:no-repeat,repeat;background-origin:padding-box;
  display:flex;flex-direction:column;justify-content:center;gap:12px}
.card::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--margin);opacity:.7}
.card .side{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:absolute;top:12px;left:64px}
.card .text{font-family:var(--display);font-size:clamp(1.15rem,2.4vw,1.45rem);line-height:2rem;white-space:pre-line;overflow-wrap:anywhere}
.card.back .text{color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:1px solid var(--rule);background:var(--card);padding:10px 18px;border-radius:8px;min-width:110px}
.btn.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.btn.again{border-color:var(--again);color:var(--again);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.link{border:none;background:none;color:var(--accent);text-decoration:underline;padding:4px 6px}
.list{background:var(--card);border-radius:6px;overflow-x:auto}
.list table{width:100%;border-collapse:collapse}
.list th,.list td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.list th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list td:first-child{width:45%}
.done{background:var(--card);border-radius:6px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font-family:var(--display);margin:0}
.toast{color:var(--ok);font-size:.9rem;text-align:center;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:active{transform:scale(.99)}}

.backlink{display:inline-block;margin:0 auto 6px;font-size:.9rem;color:var(--accent)}
</style>
</head>

const KEY = "aikya-flashcards-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

const state = { subject: Object.keys(D)[0], chapter: null, queue: [], idx: 0, flipped: false, mode: "study" };
const $ = s => document.querySelector(s);
const id = (s,c,i) => s + "|" + c + "|" + i;
const known = (s,c) => D[s][c].filter((_,i)=>store[id(s,c,i)]).length;

function renderOverall(){
  let t=0,k=0;
  for(const s in D) for(const c in D[s]){ t+=D[s][c].length; k+=known(s,c); }
  $("#overall").textContent = k + " of " + t + " cards known";
}
function renderSubjects(){
  const nav = $("#subjects"); nav.innerHTML = "";
  for (const s in D){
    const b = document.createElement("button"); b.className="subj"; b.textContent=s;
    b.setAttribute("aria-pressed", s===state.subject);
    b.onclick = () => { state.subject=s; state.chapter=Object.keys(D[s])[0]; start(); };
    nav.appendChild(b);
  }
}
function renderChapters(){
  const nav = $("#chapters"); nav.innerHTML="";
  for (const c in D[state.subject]){
    const b=document.createElement("button"); b.className="chap";
    b.setAttribute("aria-current", c===state.chapter);
    const n=D[state.subject][c].length;
    b.innerHTML = "<span></span><small>"+known(state.subject,c)+"/"+n+"</small>";
    b.firstChild.textContent=c;
    b.onclick=()=>{ state.chapter=c; start(); };
    nav.appendChild(b);
  }
}
function start(onlyUnknown){
  const cards = D[state.subject][state.chapter];
  let q = cards.map((_,i)=>i);
  if (onlyUnknown) q = q.filter(i=>!store[id(state.subject,state.chapter,i)]);
  state.queue=q; state.idx=0; state.flipped=false;
  renderSubjects(); renderChapters(); renderOverall(); renderStage();
}
function shuffle(){ const q=state.queue; for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];} state.idx=0; state.flipped=false; renderStage(); }
function mark(ok){
  const i=state.queue[state.idx]; const k=id(state.subject,state.chapter,i);
  if(ok) store[k]=1; else { delete store[k]; state.queue.push(i); }
  save(); state.idx++; state.flipped=false; renderChapters(); renderOverall(); renderStage();
}
function renderStage(){
  const st=$("#stage"); const cards=D[state.subject][state.chapter];
  const k=known(state.subject,state.chapter), n=cards.length;
  const head = '<div class="meta"><span>'+state.subject+' · '+esc(state.chapter)+'</span><span>'+k+' of '+n+' known</span></div><div class="bar"><i style="width:'+(n?k/n*100:0)+'%"></i></div>';
  if(state.mode==="list"){
    st.innerHTML = head + '<div class="list"><table><thead><tr><th>Question</th><th>Answer</th></tr></thead><tbody>'+
      cards.map(c=>'<tr><td>'+esc(c[0])+'</td><td>'+esc(c[1])+'</td></tr>').join("")+'</tbody></table></div>'+toolsHtml();
    bindTools(); return;
  }
  if(state.idx>=state.queue.length){
    st.innerHTML = head + '<div class="done"><h2>Deck finished</h2><p>'+k+' of '+n+' cards marked as known.</p><div class="controls"><button class="btn" id="redo">Study all again</button><button class="btn again" id="weak">Study cards still to learn</button></div></div>'+toolsHtml();
    $("#redo").onclick=()=>start(false); $("#weak").onclick=()=>start(true); bindTools(); return;
  }
  const c=cards[state.queue[state.idx]];
  st.innerHTML = head +
   '<div class="card '+(state.flipped?'back':'')+'" id="card" tabindex="0" role="button" aria-label="Flip card"><span class="side">'+(state.flipped?'Answer':'Question')+' · '+(state.idx+1)+' / '+state.queue.length+'</span><div class="text">'+esc(state.flipped?c[1]:c[0])+'</div></div>'+
   '<p class="hint">Tap the card or press Space to flip. Press 1 for Again, 2 for Got it.</p>'+
   '<div class="controls"><button class="btn again" id="again">Again</button><button class="btn" id="flip">'+(state.flipped?'Show question':'Show answer')+'</button><button class="btn ok" id="ok">Got it</button></div>'+toolsHtml();
  $("#card").onclick=flip; $("#flip").onclick=flip; $("#again").onclick=()=>mark(false); $("#ok").onclick=()=>mark(true);
  bindTools();
}
function toolsHtml(){ return '<div class="tools"><button class="link" id="shuf">Shuffle</button><button class="link" id="mode">'+(state.mode==="list"?"Back to cards":"List view for a parent quiz")+'</button><button class="link" id="reset">Reset this deck</button><button class="link" id="csv">Copy deck for Anki or Quizlet</button></div><p class="toast" id="toast"></p>'; }
function bindTools(){
  $("#shuf").onclick=()=>{ state.mode="study"; shuffle(); };
  $("#mode").onclick=()=>{ state.mode = state.mode==="list"?"study":"list"; renderStage(); };
  $("#reset").onclick=()=>{ D[state.subject][state.chapter].forEach((_,i)=>delete store[id(state.subject,state.chapter,i)]); save(); start(); toast("Deck reset"); };
  $("#csv").onclick=()=>{
    const txt=D[state.subject][state.chapter].map(c=>c[0].replace(/\t/g," ")+"\t"+c[1].replace(/\t/g," ")).join("\n");
    const done=()=>toast("Copied. Paste into Anki or Quizlet import (tab-separated).");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt)); } else fallback(txt);
  };
}
function fallback(txt){ state.mode="list"; renderStage(); toast("Copy blocked here: select the table text instead."); }
function toast(m){ const t=$("#toast"); if(t) t.textContent=m; }
function flip(){ state.flipped=!state.flipped; renderStage(); const c=$("#card"); if(c) c.focus(); }
function esc(s){ return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
document.addEventListener("keydown",e=>{
  if(state.mode!=="study"||!$("#card")) return;
  if(e.code==="Space"){ e.preventDefault(); flip(); }
  else if(e.key==="1") mark(false);
  else if(e.key==="2") mark(true);
});
state.chapter = Object.keys(D[state.subject])[0];
start();
</script>
